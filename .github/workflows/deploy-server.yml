# Deploy aplikasi ditangani Vercel Git Integration (build & deploy di infra Vercel).
# Workflow ini KHUSUS menjalankan migrasi database production — satu hal, dan benar.
name: Server DB Migrations (Production)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './server/package.json'

      - name: Install Dependencies
        run: |
          cd server
          npm ci

      # Fail-fast: kalau secret belum tersedia, hentikan di sini dengan
      # pesan yang jelas — bukan error samar dari drizzle-kit.
      - name: Preflight — verifikasi PROD_DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret PROD_DATABASE_URL tidak terbaca. Buat sebagai Repository Secret (bukan Environment Secret / Variable) dengan nama persis 'PROD_DATABASE_URL', lalu Re-run jobs."
            exit 1
          fi
          echo "DATABASE_URL terbaca (panjang ${#DATABASE_URL} karakter)."
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      # Migrasi idempotent: hanya menerapkan entri jurnal yang belum ada.
      # Skema per modul bersifat additive sehingga aman terhadap kode yang
      # sedang di-build paralel oleh Vercel Git Integration.
      - name: Run Database Migrations (Production)
        run: |
          cd server
          npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
