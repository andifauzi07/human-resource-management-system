name: Deploy Server to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './server/package.json'

      - name: Install Dependencies
        run: |
          cd server
          npm ci

      # Fail-fast: kalau secret belum tersedia, hentikan di sini dengan
      # pesan yang jelas — bukan error samar dari drizzle-kit.
      - name: Preflight — verifikasi PROD_DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret PROD_DATABASE_URL tidak terbaca. Buat sebagai Repository Secret (bukan Environment Secret / Variable) dengan nama persis 'PROD_DATABASE_URL', lalu Re-run jobs."
            exit 1
          fi
          echo "DATABASE_URL terbaca (panjang ${#DATABASE_URL} karakter)."
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      # Migrasi HARUS berjalan sebelum deploy (skema additive → aman untuk
      # kode lama). Idempotent: hanya menerapkan entri jurnal yang belum ada.
      # Gagal migrasi = workflow berhenti = deploy dibatalkan.
      - name: Run Database Migrations (Production)
        run: |
          cd server
          npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Info
        working-directory: ./server
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        working-directory: ./server
        run: vercel build --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Artifacts to Vercel
        working-directory: ./server
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
