# Database development lokal.
# Catatan: samakan versi mayor dengan versi Postgres yang dipakai Neon (production).
services:
  db:
    image: postgres:17-alpine
    container_name: hris-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hris
    ports:
      # Host 5433 (bukan 5432) untuk menghindari bentrok dengan layanan
      # Postgres native yang mungkin sudah terpasang di mesin developer.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
